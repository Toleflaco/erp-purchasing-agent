spring:
  application:
    name: erp-purchasing-agent
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      chat:
        model: claude-sonnet-4-5
        max-tokens: 4096
    mcp:
      client:
        streamable-http:
          connections:
            erp-server:
              url: http://localhost:8080
              endpoint: /mcp
server:
  port: 8082

llm:
  pricing:
    input-per-mtok: 3.0
    output-per-mtok: 15.0

logging:
  level:
    dev.toleflaco.erp_purchasing_agent.agent: DEBUG
