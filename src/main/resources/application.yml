spring:
  application:
    name: erp-purchasing-agent
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      chat:
        model: claude-sonnet-4-5
        max-tokens: 4096
    mcp:
      client:
        streamable-http:
          connections:
            erp-server:
              url: http://localhost:8080
              endpoint: /mcp
server:
  port: 8082
